<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="nb3Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E54D6"/>
      <stop offset="100%" stop-color="#0E2E85"/>
    </linearGradient>
    <linearGradient id="nb3Cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="nb3Gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#nb3Bg)"/>
  <!-- Notebook page depth block -->
  <rect x="122" y="96" width="290" height="340" rx="28" fill="#FEF3C7" stroke="#92400E" stroke-width="4" stroke-opacity="0.2"/>
  <rect x="116" y="88" width="286" height="332" rx="28" fill="#FFFBEB"/>
  <!-- Gold bookmark ribbon -->
  <path d="M326 392 V458 L348 440 L370 458 V392 Z" fill="url(#nb3Gold)"/>
  <!-- Front sapphire cover -->
  <rect x="110" y="80" width="276" height="328" rx="26" fill="url(#nb3Cover)" stroke="#60A5FA" stroke-width="4"/>
  <!-- Spine crease -->
  <line x1="146" y1="84" x2="146" y2="404" stroke="#1E3A8A" stroke-width="5" stroke-opacity="0.45"/>
  <!-- Spiral rings on left -->
  <g fill="#E2E8F0" stroke="#475569" stroke-width="2">
    <rect x="78" y="114" width="52" height="18" rx="9"/>
    <rect x="78" y="160" width="52" height="18" rx="9"/>
    <rect x="78" y="206" width="52" height="18" rx="9"/>
    <rect x="78" y="252" width="52" height="18" rx="9"/>
    <rect x="78" y="298" width="52" height="18" rx="9"/>
    <rect x="78" y="344" width="52" height="18" rx="9"/>
  </g>
  <!-- Bold geometric '3' emblem -->
  <text x="260" y="298" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="188" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="4" paint-order="stroke">3</text>
  <!-- Golden accent badge strip -->
  <rect x="196" y="338" width="128" height="12" rx="6" fill="url(#nb3Gold)"/>
</svg>
